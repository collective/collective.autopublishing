# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.lock
.venv
htmlcov/
.mxdev_cache/
requirements.txt
"""

[pyproject]
# Not imported, but needed: plone.behavior provides the plone:behavior ZCML
# directive, and the templates use the Products.CMFPlone main and control panel
# macros.
dependencies_ignores = "['zestreleaser.towncrier', 'zest.releaser', 'zope.testrunner', 'Products.CMFPlone', 'plone.behavior']"

[tox]
test_matrix = {"6.2" = ["3.14", "3.13", "3.12", "3.11", "3.10"], "6.1" = ["3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt", "6.1" = "https://dist.plone.org/release/6.1-latest/constraints.txt"}
# collective.timedevents 1.1 calls pkg_resources, which Plone 6.2 no longer
# ships: test against its plone62 branch (also checked out by mx.ini) until it
# is released.
test_deps_additional = """
collective.timedevents @ git+https://github.com/collective/collective.timedevents.git@plone62
"""

[github]
jobs = [
    "qa",
    "coverage",
    "release_ready",
    "circular",
    "dependencies",
    ]
