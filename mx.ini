; This is a mxdev configuration file
; it can be used to override versions of packages already defined in the
; constraints files and to add new packages from VCS like git.
; to learn more about mxdev visit https://pypi.org/project/mxdev/

[settings]
main-package = -e .[test]
; example how to override a package version
; version-overrides =
;     example.package==2.1.0a2

; collective.timedevents 1.1 calls pkg_resources, which Plone 6.2 no longer
; ships: use its plone62 branch until it is released.
[collective.timedevents]
url = https://github.com/collective/collective.timedevents.git
pushurl = git@github.com:collective/collective.timedevents.git
branch = plone62
